  #     - DISPATCHARR_LOG_LEVEL=info
  #
  #   # Hardware acceleration can be added later.
  #   # Windows Docker Desktop GPU configuration is different
  #   # from native Linux Docker.
  #
  #   restart: unless-stopped

  # ============================================================
  # GLUETUN
  # ============================================================
  
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
  
    cap_add:
      - NET_ADMIN
  
    devices:
      - /dev/net/tun:/dev/net/tun
  
    restart: unless-stopped
  
    environment:
  
      # --------------------------------------------------------
      # VPN
      # --------------------------------------------------------
  
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}
      - VPN_TYPE=${VPN_TYPE}
  
      # AirVPN WireGuard configuration
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_KEY}
      - WIREGUARD_PRESHARED_KEY=${WIREGUARD_PRESHARED_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADD}
  
      # Optional server selection
      - SERVER_COUNTRIES=${VPN_SERVER_COUNTRIES:-}
  
      # --------------------------------------------------------
      # WireGuard
      # --------------------------------------------------------
  
      - WIREGUARD_MTU=${WIREGUARD_MTU:-1200}
  
      # --------------------------------------------------------
      # AirVPN port forwarding
      # --------------------------------------------------------
  
      # Port obtained from AirVPN
      - FIREWALL_VPN_INPUT_PORTS=${AIRVPN_PORT}
  
      # --------------------------------------------------------
      # LAN access
      # --------------------------------------------------------
  
      # qBittorrent WebUI
      - FIREWALL_INPUT_PORTS=8080
  
      # --------------------------------------------------------
      # DNS
      # --------------------------------------------------------
  
      - DNS_UPSTREAM_RESOLVERS=${GLUETUN_DNS_UPSTREAM_RESOLVERS:-gluetun}
  
      # --------------------------------------------------------
      # Server database updater
      # --------------------------------------------------------
  
      - UPDATER_PERIOD=24h
      - UPDATER_VPN_SERVICE_PROVIDERS=${VPN_SERVICE_PROVIDER}

      - DNS_BLOCK_MALICIOUS=false
  
    ports:
  
      # qBittorrent WebUI
      - "8080:8080"
  
      # Your other services sharing Gluetun
      - "7474:7474"
      - "8191:8191"
      - "9191:9191"
  
    networks:
      - starr
  
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
  # ============================================================
  # HOMARR
  # ============================================================

  homarr:
    image: ghcr.io/homarr-labs/homarr:latest
    container_name: homarr

    restart: unless-stopped

    environment:
      - SECRET_ENCRYPTION_KEY=${HOMARR_KEY}
      - NEXTAUTH_SECRET=${HOMARR_NEXTAUTH_SECRET:-}
      - AUTH_PROVIDERS=${HOMARR_AUTH_PROVIDERS:-credentials}
      - AUTH_OIDC_ISSUER=${HOMARR_OIDC_ISSUER:-}
      - AUTH_LOGOUT_REDIRECT_URL=${HOMARR_OIDC_LOGOUT_REDIRECT_URL:-}
      - AUTH_OIDC_CLIENT_ID=${HOMARR_OIDC_CLIENT_ID:-}
      - AUTH_OIDC_CLIENT_SECRET=${HOMARR_OIDC_CLIENT_SECRET:-}
      - AUTH_OIDC_CLIENT_NAME=${HOMARR_OIDC_CLIENT_NAME:-OIDC}
      - AUTH_OIDC_AUTO_LOGIN=${HOMARR_OIDC_AUTO_LOGIN:-false}
      - AUTH_OIDC_SCOPE_OVERWRITE=${HOMARR_OIDC_SCOPE:-openid email profile groups}
      - AUTH_OIDC_GROUPS_ATTRIBUTE=${HOMARR_OIDC_GROUPS_ATTRIBUTE:-groups}
      - AUTH_OIDC_NAME_ATTRIBUTE_OVERWRITE=${HOMARR_OIDC_NAME_ATTRIBUTE:-}
      - AUTH_OIDC_FORCE_USERINFO=${HOMARR_OIDC_FORCE_USERINFO:-false}
      - AUTH_OIDC_ENABLE_DANGEROUS_ACCOUNT_LINKING=${HOMARR_OIDC_ENABLE_DANGEROUS_ACCOUNT_LINKING:-false}

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${BASE_PATH}/homarr:/appdata

    ports:
      - "7575:7575"

    networks:
      - starr


  # ============================================================
  # DECLUTTARR
  # ============================================================

  decluttarr:
    image: ghcr.io/manimatter/decluttarr:latest
    container_name: decluttarr

    restart: unless-stopped

    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}

      LOG_LEVEL: INFO

      TIMER: 10

      REMOVE_FAILED_DOWNLOADS: True
      REMOVE_METADATA_MISSING: True
      REMOVE_MISSING_FILES: True
      REMOVE_ORPHANS: True
      REMOVE_SLOW: True
      REMOVE_STALLED: True
      REMOVE_UNMONITORED: True

      SEARCH_MISSING: |
        min_days_between_searches: 7
        max_concurrent_searches: 3

      MAX_STRIKES: 3
      PROTECTED_TAG: Don't Kill
      MIN_SPEED: 100

      REMOVE_FAILED_IMPORTS: |
        message_patterns:
          - "Not a Custom Format upgrade for existing"
          - "Not an upgrade for existing"

      RADARR: >
        - base_url: "http://radarr:7878"
          api_key: "${RADARR_KEY}"

      SONARR: >
        - base_url: "http://sonarr:8989"
          api_key: "${SONARR_KEY}"

      LIDARR: >
        - base_url: "http://lidarr:8686"
          api_key: "${LIDARR_KEY}"

      READARR: >
        - base_url: "http://readarr:8787"
          api_key: "${READARR_KEY}"

      QBITTORRENT: >
        - base_url: "http://gluetun:8080"
          username: "${QBIT_USER}"
          password: "${QBIT_PASS}"

    networks:
      - starr


