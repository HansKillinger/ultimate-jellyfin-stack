networks:
  starr:
  jellystat:
  proxy:
    external: true

services:

  # ============================================================
  # JELLYFIN
  # ============================================================

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin

    environment:
      - JELLYFIN_PublishedServerUrl=${JELLYFIN_URL}
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}

    ports:
      - "8096:8096"
      - "8920:8920"

    volumes:
      - ${BASE_PATH}/jellyfin/config:/config
      - ${TV_PATH}:/data/tv
      - ${MOVIES_PATH}:/data/movies

    restart: unless-stopped

    networks:
      - starr
      - proxy


  # ============================================================
  # RADARR
  # ============================================================

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr

    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}

    volumes:
      - ${BASE_PATH}/radarr/config:/config
      - ${MOVIES_PATH}:/data/movies
      - ${MOVIES_PATH}/downloads:/data/downloads

    ports:
      - "7878:7878"

    networks:
      - starr

    restart: unless-stopped


  # ============================================================
  # SONARR
  # ============================================================

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr

    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}

    volumes:
      - ${BASE_PATH}/sonarr/config:/config
      - ${TV_PATH}:/data/tv
      - ${MOVIES_PATH}/downloads:/data/downloads

    ports:
      - "8989:8989"

    networks:
      - starr

    restart: unless-stopped


