  # ============================================================
  # QBITTORRENT
  # ============================================================
  
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun"
  
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
      - TORRENTING_PORT=${AIRVPN_PORT}
      - UMASK=002
  
    volumes:
      - ${BASE_PATH}/qbittorrent/config:/config
      - ${TV_PATH}:/data/tv
      - ${MOVIES_PATH}:/data/movies
      - ${MOVIES_PATH}/downloads:/data/downloads
  
    depends_on:
      gluetun:
        condition: service_healthy
  
    restart: unless-stopped


  # ============================================================
  # TDARR
  # ============================================================

  tdarr:
    image: ghcr.io/haveagitgat/tdarr:latest
    container_name: tdarr

    restart: unless-stopped

    ports:
      - "8265:8265"
      - "8266:8266"

    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK_SET=002
      - nodeName=ServerNode
      - serverIP=0.0.0.0
      - serverPort=8266
      - webUIPort=8265
      - internalNode=true
      - inContainer=true
      - ffmpegVersion=6

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    volumes:
      - ${BASE_PATH}/tdarr/server:/app/server
      - ${BASE_PATH}/tdarr/configs:/app/configs
      - ${BASE_PATH}/tdarr/logs:/app/logs
      - ${TV_PATH}:/data/tv
      - ${MOVIES_PATH}:/data/movies
      - ${TRANSCODE_PATH}:/temp

    networks:
      - starr


  # ============================================================
  # BAZARR
  # ============================================================

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr

    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}

    volumes:
      - ${BASE_PATH}/bazarr/config:/config
      - ${TV_PATH}:/data/tv
      - ${MOVIES_PATH}:/data/movies

    ports:
      - "6767:6767"

    networks:
      - starr

    restart: unless-stopped


