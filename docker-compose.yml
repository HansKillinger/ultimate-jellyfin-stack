    container_name: prowlarr

    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}

    networks:
      - starr
    
    ports:
      - "9696:9696"

    volumes:
      - ${BASE_PATH}/prowlarr/config:/config

    restart: unless-stopped

  # ============================================================
  # BYPARR
  # ============================================================

  byparr:
    image: ghcr.io/thephaseless/byparr:latest
    container_name: byparr
    environment:
      - TZ=${TZ}
    volumes:
      - ${BASE_PATH}/byparr:/config
    shm_size: 512mb
    networks:
      - starr
    restart: unless-stopped

  # ============================================================
  # SABNZBD
  # ============================================================

  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${BASE_PATH}/sabnzbd:/config
      - ${MOVIES_PATH}:/movies
      - ${TV_PATH}:/tv
      - ${BASE_PATH}/downloads:/downloads
    ports:
      - "8085:8080"
    networks:
